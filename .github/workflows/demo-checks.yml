name: Organisation demo checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'test/demo-contract.test.cjs'
      - 'business-tools/**'
      - 'test/business-tools.test.mjs'
      - 'test/vat-pay-tax.test.mjs'
      - 'sitemap.xml'
      - 'README.md'
      - '.github/workflows/demo-checks.yml'
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo JavaScript syntax
        run: node --check script.js
      - name: Run demo contract smoke tests
        run: node --test test/demo-contract.test.cjs

      - name: Check calculator module syntax
        run: node --check business-tools/calculators.mjs && node --check business-tools/pay-tax.mjs && node --check business-tools/calculator-ui.mjs
      - name: Run calculator and page-contract tests
        run: node --test test/business-tools.test.mjs test/vat-pay-tax.test.mjs
